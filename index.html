<style>
:root{
  --pu:#7C3AED;--pu2:#5B21B6;--pu3:#EDE9FE;--pu4:#F5F3FF;
  --ink:#1A1530;--ink2:#4B4763;--mut:#8A86A0;--line:#ECEAF3;--bg:#F6F5FA;--card:#fff;
  --ok:#16A34A;--okb:#DCFCE7;--okt:#166534;
  --am:#D97706;--amb:#FEF3C7;--amt:#92400E;
  --rd:#DC2626;--rdb:#FEE2E2;--rdt:#991B1B;
  --bl:#2563EB;--blb:#DBEAFE;--blt:#1E40AF;
  --wa:#25D366;--wa2:#128C7E;
  --r:16px;--sh:0 1px 2px rgba(26,21,48,.06),0 4px 14px rgba(26,21,48,.06);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.4}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.app{max-width:560px;margin:0 auto;min-height:100%;position:relative;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
/* header */
.top{position:sticky;top:0;z-index:20;background:linear-gradient(135deg,#6D28D9,#4C1D95);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 16px 14px;display:flex;align-items:center;gap:12px;box-shadow:0 6px 20px rgba(76,29,149,.25)}
.top .lg{width:40px;height:40px;border-radius:12px;background:#fff;display:grid;place-items:center;flex:none;overflow:hidden}
.top .lg img{width:32px;height:32px}
.top h1{font-size:17px;font-weight:800;line-height:1.15;letter-spacing:-.2px}
.top small{display:block;font-size:12px;opacity:.85;font-weight:500}
.top .act{margin-left:auto;display:flex;gap:6px}
.ib{width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,.14);display:grid;place-items:center;color:#fff}
.ib svg{width:20px;height:20px}
main{padding:14px 14px 10px}
h2.sec{font-size:13px;font-weight:800;color:var(--mut);letter-spacing:.6px;text-transform:uppercase;margin:18px 4px 10px;display:flex;align-items:center;gap:8px}
h2.sec .cnt{background:var(--pu3);color:var(--pu2);border-radius:20px;padding:1px 8px;font-size:11px;letter-spacing:0}
/* KPIs */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--card);border-radius:var(--r);padding:12px 14px;box-shadow:var(--sh);position:relative;overflow:hidden}
.kpi small{display:block;font-size:12px;color:var(--mut);font-weight:700}
.kpi b{display:block;font-size:26px;font-weight:800;letter-spacing:-.5px;margin-top:2px}
.kpi .hint{font-size:11.5px;color:var(--mut);font-weight:500}
.kpi.rd b{color:var(--rd)}.kpi.ok b{color:var(--ok)}.kpi.pu{background:linear-gradient(135deg,#7C3AED,#4338CA);color:#fff}.kpi.pu small,.kpi.pu .hint{color:#DDD6FE}.kpi.pu b{color:#FDE68A}
.kpi .ico{position:absolute;right:10px;top:10px;font-size:18px;opacity:.9}
/* cards */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:14px}
.alert{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:14px;margin-bottom:10px;border-left:5px solid var(--rd)}
.alert.am{border-left-color:var(--am)}
.alert .hd{display:flex;align-items:center;gap:10px}
.alert .nm{font-weight:800;font-size:16px}
.alert .sub{font-size:13px;color:var(--ink2)}
.alert .usual{margin-top:8px;font-size:13px;color:var(--ink2);background:var(--pu4);border-radius:10px;padding:8px 10px}
.alert .usual b{color:var(--pu2)}
.row2{display:flex;gap:8px;margin-top:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;padding:11px 14px;font-weight:800;font-size:14px;transition:transform .08s}
.btn:active{transform:scale(.97)}
.btn svg{width:18px;height:18px}
.b-wa{background:var(--wa);color:#fff;flex:1}
.b-pu{background:var(--pu);color:#fff}
.b-gh{background:var(--pu3);color:var(--pu2)}
.b-ln{background:#fff;border:1.5px solid var(--line);color:var(--ink2)}
.b-rd{background:var(--rdb);color:var(--rdt)}
.b-full{width:100%}
.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;flex:none;font-size:16px}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:800;padding:3px 9px;border-radius:20px;white-space:nowrap}
.t-ok{background:var(--okb);color:var(--okt)}.t-am{background:var(--amb);color:var(--amt)}.t-rd{background:var(--rdb);color:var(--rdt)}.t-bl{background:var(--blb);color:var(--blt)}.t-gr{background:#F1F0F6;color:var(--ink2)}.t-pu{background:var(--pu3);color:var(--pu2)}
/* lista clientes */
.search{display:flex;align-items:center;gap:8px;background:#fff;border-radius:14px;padding:0 12px;box-shadow:var(--sh);border:1.5px solid transparent}
.search:focus-within{border-color:var(--pu)}
.search input{flex:1;border:0;outline:0;background:none;padding:12px 0;font-size:15px}
.search svg{width:18px;height:18px;color:var(--mut)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 2px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 13px;border-radius:20px;background:#fff;border:1.5px solid var(--line);font-size:13px;font-weight:700;color:var(--ink2)}
.chip.on{background:var(--pu);border-color:var(--pu);color:#fff}
.chip .n{opacity:.7;margin-left:4px}
.list{background:#fff;border-radius:var(--r);box-shadow:var(--sh);overflow:hidden;margin-top:10px}
.li{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.li:last-child{border-bottom:0}
.li:active{background:var(--pu4)}
.li .tx{flex:1;min-width:0}
.li .tx b{display:block;font-weight:800;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .tx small{display:block;font-size:12.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .rt{text-align:right}
.li .rt small{display:block;font-size:11px;color:var(--mut);margin-top:3px}
.empty{text-align:center;padding:34px 20px;color:var(--mut)}
.empty .em{font-size:40px;margin-bottom:6px}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:end;height:68px}
.tb{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700;color:var(--mut);padding-bottom:10px}
.tb svg{width:23px;height:23px}
.tb.on{color:var(--pu)}
.tb.fab{position:relative}
.tb.fab span.c{width:56px;height:56px;border-radius:18px;background:linear-gradient(135deg,#7C3AED,#5B21B6);color:#fff;display:grid;place-items:center;margin-top:-26px;box-shadow:0 8px 20px rgba(124,58,237,.45)}
.tb.fab span.c svg{width:28px;height:28px}
.tb .bd{position:absolute;top:6px;right:calc(50% - 20px);background:var(--rd);color:#fff;font-size:10px;font-weight:800;border-radius:10px;padding:1px 6px}
/* hojas / modales */
.ov{position:fixed;inset:0;background:rgba(20,14,40,.45);z-index:50;display:none;align-items:flex-end;justify-content:center}
.ov.show{display:flex;animation:fd .15s}
@keyframes fd{from{opacity:0}to{opacity:1}}
@keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;border-radius:22px 22px 0 0;overflow:auto;animation:up .2s;padding-bottom:calc(16px + env(safe-area-inset-bottom))}
.sheet .sh{position:sticky;top:0;background:var(--bg);z-index:2;padding:10px 16px 8px;display:flex;align-items:center;gap:10px}
.sheet .sh:before{content:"";position:absolute;left:50%;top:6px;width:40px;height:4px;border-radius:4px;background:#D6D3E2;transform:translateX(-50%)}
.sheet .sh h3{font-size:18px;font-weight:800;margin-top:10px;flex:1}
.sheet .sh .x{margin-top:10px;width:34px;height:34px;border-radius:10px;background:#fff;display:grid;place-items:center;box-shadow:var(--sh)}
.sheet .bd{padding:4px 16px 10px}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:12.5px;font-weight:800;color:var(--ink2);margin:0 2px 5px}
.fld input,.fld select,.fld textarea{width:100%;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;font-size:15px;outline:0}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--pu)}
.fld textarea{min-height:92px;resize:vertical}
.fld .help{font-size:12px;color:var(--mut);margin:5px 2px 0}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.items .it{display:grid;grid-template-columns:1fr 64px 84px 34px;gap:6px;margin-bottom:6px;align-items:center}
.items .it input{width:100%;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:9px 8px;font-size:14px;outline:0}
.items .it input:focus{border-color:var(--pu)}
.items .hd{display:grid;grid-template-columns:1fr 64px 84px 34px;gap:6px;font-size:11px;font-weight:800;color:var(--mut);margin:0 2px 4px}
.del{width:34px;height:34px;border-radius:10px;background:var(--rdb);color:var(--rdt);display:grid;place-items:center;font-weight:800}
.tot{display:flex;justify-content:space-between;align-items:center;background:#fff;border-radius:14px;padding:12px 14px;margin:10px 0;box-shadow:var(--sh)}
.tot b{font-size:24px;font-weight:800;color:var(--pu2)}
.qp{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 10px}
.qp button{padding:6px 11px;border-radius:20px;background:#fff;border:1.5px solid var(--line);font-size:12.5px;font-weight:700;color:var(--ink2)}
.qp button.on{border-color:var(--pu);background:var(--pu4);color:var(--pu2)}
/* detalle */
.prof{display:flex;align-items:center;gap:14px;background:#fff;border-radius:var(--r);padding:14px;box-shadow:var(--sh)}
.prof .av{width:58px;height:58px;font-size:22px}
.prof b{font-size:19px;font-weight:800;display:block}
.prof small{color:var(--mut);font-size:13px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.stats div{background:#fff;border-radius:14px;padding:10px;text-align:center;box-shadow:var(--sh)}
.stats small{display:block;font-size:11px;color:var(--mut);font-weight:700}
.stats b{font-size:17px;font-weight:800}
.hist .h{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.hist .h:last-child{border-bottom:0}
.hist .h small{display:block;color:var(--mut);font-size:12px}
.prev{background:#E7DED3;border-radius:14px;padding:12px;margin-top:6px}
.prev .bub{background:#D9FDD3;border-radius:12px 3px 12px 12px;padding:10px 12px;font-size:14px;white-space:pre-wrap;margin-left:24px;box-shadow:0 1px 1px rgba(0,0,0,.1)}
/* resultados */
.bars{display:flex;align-items:flex-end;gap:6px;height:130px;padding:10px 4px 0}
.bars .bc{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.bars .bar{width:100%;border-radius:8px 8px 3px 3px;background:linear-gradient(180deg,#A78BFA,#7C3AED);min-height:3px}
.bars small{font-size:10.5px;color:var(--mut);font-weight:700}
.bars .v{font-size:10px;color:var(--ink2);font-weight:800}
.toast{position:fixed;left:50%;top:calc(76px + env(safe-area-inset-top));transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 16px;border-radius:12px;font-weight:700;font-size:14px;z-index:80;box-shadow:0 10px 30px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;text-align:center}
.toast.show{opacity:1}
.who{display:flex;gap:8px}
.who input{flex:1;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;outline:0;font-size:15px}
.who input:focus{border-color:var(--pu)}
.warn{background:var(--amb);color:var(--amt);border-radius:12px;padding:10px 12px;font-size:13px;font-weight:600;margin-bottom:12px}
.foot{text-align:center;color:var(--mut);font-size:12px;margin:22px 0 8px}
.foot b{color:var(--pu2)}
.pill-n{display:inline-block;min-width:22px;text-align:center}
.hide{display:none!important}
.ib.inst{width:auto;padding:0 12px;font-weight:800;font-size:13px;gap:6px;display:flex;align-items:center;background:#FDE68A;color:#3B0764}
.ib.inst:after{content:'Instalar'}
.instcard{display:flex;gap:12px;align-items:center;background:#fff;border:1.5px solid var(--pu3);border-radius:16px;padding:12px 14px;margin-bottom:12px;box-shadow:var(--sh)}
.instcard img{width:46px;height:46px;border-radius:12px}
.instcard b{display:block;font-size:14.5px}.instcard small{color:var(--mut);font-size:12.5px}
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.qb{background:#fff;border-radius:14px;padding:10px 4px;box-shadow:var(--sh);display:flex;flex-direction:column;align-items:center;gap:1px;border:1.5px solid transparent}
.qb:active{transform:scale(.96);border-color:var(--pu)}
.qb span{font-size:22px;line-height:1.1}.qb b{font-size:12px;font-weight:800;line-height:1.15;text-align:center}.qb small{font-size:10.5px;color:var(--mut);text-align:center;line-height:1.1}
.qb.off{opacity:.45}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;max-height:262px;overflow:auto;padding:8px 6px 2px 0}
.pb{position:relative;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:9px 6px;text-align:center;min-height:58px;display:flex;flex-direction:column;justify-content:center}
.pb b{font-size:12.5px;font-weight:800;line-height:1.15}.pb small{font-size:11.5px;color:var(--pu2);font-weight:700;margin-top:2px}
.pb.on{background:var(--pu4);border-color:var(--pu)}
.pb .q{position:absolute;top:-7px;right:-5px;background:var(--pu);color:#fff;font-size:11.5px;font-weight:800;border-radius:12px;min-width:22px;padding:2px 6px;box-shadow:0 2px 6px rgba(124,58,237,.4)}
.pb.pop{animation:pp .25s}@keyframes pp{50%{transform:scale(1.08)}}
.ci{display:grid;grid-template-columns:1fr 100px 66px;gap:6px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line)}
.ci:last-child{border-bottom:0}
.ci input{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:8px;font-size:14px;outline:0;background:#fff}
.ci .nm input{font-weight:700}
.ci .st{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.ci .st button{width:30px;height:36px;font-size:18px;font-weight:800;color:var(--pu2);background:var(--pu4)}
.ci .st input{border:0;border-radius:0;text-align:center;padding:8px 2px;font-weight:800}
.ci .pr{text-align:right}
.ci .pr.falta{border-color:#F59E0B;background:#FFFBEB}
.lnk{color:var(--pu);font-weight:800;font-size:12.5px}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kp button{background:#fff;border-radius:14px;padding:16px 0;font-size:24px;font-weight:800;box-shadow:var(--sh)}
.kp button:active{background:var(--pu3)}
.hero{background:linear-gradient(135deg,#7C3AED,#4338CA);color:#fff;border-radius:20px;padding:16px;box-shadow:0 10px 30px rgba(91,33,182,.3)}
.hero small{color:#DDD6FE;font-weight:700;font-size:12.5px}
.hero b{display:block;font-size:30px;font-weight:800;color:#FDE68A;letter-spacing:-.5px}
.hero p{font-size:13px;color:#EDE9FE;margin-top:2px}
</style>
</head>

const today0=()=>{const d=new Date();d.setHours(0,0,0,0);return d;};

function salesOf(cid){return DB.sales.filter(s=>s.clientId===cid).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);}
function stats(c){
  const ss=salesOf(c.id);const t0=today0();
  const last=ss.length?ss[ss.length-1]:null;
  // frecuencia: mediana de intervalos entre compras (últimas 8)
  let freq=null;
  if(ss.length>=2){const dd=[];const rec=ss.slice(-9);for(let i=1;i<rec.length;i++){const g=daysBetween(dParse(rec[i-1].date),dParse(rec[i].date));if(g>0)dd.push(g);}
    if(dd.length){dd.sort((a,b)=>a-b);freq=dd[Math.floor(dd.length/2)];}}
  const freqUsada=c.freq?+c.freq:(freq||DB.settings.frecDefecto);
  const dias=last?daysBetween(dParse(last.date),t0):null;
  const total=ss.reduce((a,s)=>a+(+s.total||0),0);
  const ticket=ss.length?total/ss.length:0;
  // productos de siempre
  const cnt={};ss.slice(-10).forEach(s=>(s.items||[]).forEach(it=>{const k=it.name.trim();if(!k)return;cnt[k]=(cnt[k]||0)+1;}));
  const usual=Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,3).map(x=>x[0]);
  let estado='nuevo';
  if(last){const r=dias/freqUsada;estado=r>DB.settings.umbralRojo?'rojo':r>DB.settings.umbralAmarillo?'amarillo':'ok';}
  const anual=ticket*(365/freqUsada);
  const ultContacto=DB.contacts.filter(x=>x.clientId===c.id).sort((a,b)=>a.date<b.date?1:-1)[0]||null;
  return {ss,last,freq,freqUsada,dias,total,ticket,usual,estado,anual,ultContacto,n:ss.length};
}
const EST={ok:['t-ok','Al día ✓'],amarillo:['t-am','Por volver'],rojo:['t-rd','Se está yendo'],nuevo:['t-bl','Nuevo']};
function tagFor(st){const [c,l]=EST[st.estado];if(st.estado==='rojo'||st.estado==='amarillo')return `<span class="tag ${c}">${st.dias} días${st.estado==='rojo'?' ⚠️':''}</span>`;return `<span class="tag ${c}">${l}</span>`;}
function recuperados(desde,hasta){ // contacto mientras estaba en riesgo y compra dentro de 10 días después
  const res=[];
  DB.contacts.filter(x=>x.tipo==='vuelve'&&x.date>=desde&&x.date<=hasta).forEach(ct=>{
    const s=DB.sales.filter(v=>v.clientId===ct.clientId&&v.date>=ct.date&&daysBetween(dParse(ct.date),dParse(v.date))<=10).sort((a,b)=>a.date<b.date?-1:1)[0];
    if(s&&!res.find(r=>r.saleId===s.id))res.push({clientId:ct.clientId,saleId:s.id,total:+s.total||0,date:s.date});});
  return res;
}

function buildMsg(c,tipo){
  const st=stats(c);const S=DB.settings;let t=S.tpl[tipo]||DEF_TPL[tipo];
  const nombre=corto(c.name);
  const prods=st.usual.length?st.usual.join(', ').replace(/, ([^,]*)$/,' y $1'):'sus productos de siempre';
  const desc=+S.descuento>0?` Esta semana con ${S.descuento}% para usted`:'';
  return t.replaceAll('{nombre}',nombre).replaceAll('{negocio}',S.negocio).replaceAll('{productos}',prods).replaceAll('{descuento}',desc);
}

}

// ================== VISTA: CLIENTES ==================
function vClientes(){
  const all=DB.clients.map(c=>({c,st:stats(c)}));
  const cuenta=k=>k==='todos'?all.length:all.filter(x=>x.st.estado===k).length;
  const F=[['todos','Todos'],['rojo','Se van'],['amarillo','Por volver'],['ok','Al día'],['nuevo','Nuevos']];
  const q=busq.trim().toLowerCase();const qd=q.replace(/\D/g,'');
  let L=all.filter(x=>(filtro==='todos'||x.st.estado===filtro)&&(!q||x.c.name.toLowerCase().includes(q)||(qd.length>=3&&normPhone(x.c.phone).includes(qd))));
  const ord={rojo:0,amarillo:1,nuevo:2,ok:3};L.sort((a,b)=>ord[a.st.estado]-ord[b.st.estado]||(b.st.dias||0)-(a.st.dias||0)||a.c.name.localeCompare(b.c.name));
  let h=`<div class="search">${ICON.search}<input id="q" placeholder="Buscar por nombre o número" value="${esc(busq)}" inputmode="search"></div>
  <div class="chips">${F.map(([k,l])=>`<button class="chip ${filtro===k?'on':''}" data-f="${k}">${l}<span class="n">${cuenta(k)}</span></button>`).join('')}</div>
  <div class="row2" style="margin-top:6px"><button class="btn b-pu b-full" id="cNew">＋ Nuevo cliente</button></div>`;
  if(!L.length)h+=`<div class="list"><div class="empty"><div class="em">🔎</div><b>${all.length?'Sin resultados':'Aún no tienes clientes'}</b>${all.length?'Prueba con otro nombre o filtro.':'Agrega tu primer cliente con el botón de arriba.'}</div></div>`;
  else h+=`<div class="list">${L.map(({c,st})=>`<button class="li" data-ver="${c.id}"><div class="av" style="background:${colorOf(c.id)}">${esc(ini(c.name))}</div>
    <div class="tx"><b>${esc(c.name)}</b><small>${st.usual.length?esc(st.usual.join(', ')):(c.phone?esc(fmtPhone(c.phone)):'Sin compras aún')}</small></div>
    <div class="rt">${tagFor(st)}<small>${st.last?'Últ. '+fFecha(st.last.date):'—'}</small></div></button>`).join('')}</div>`;
  $('#view').innerHTML=h+FOOT;
  const qi=$('#q');qi.oninput=()=>{busq=qi.value;const pos=qi.selectionStart;vClientes();const n=$('#q');n.focus();n.setSelectionRange(pos,pos);};
  document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{filtro=b.dataset.f;vClientes();});
  $('#cNew').onclick=()=>sheetCliente();
  bindCommon();
}
// ================== VISTA: RESULTADOS ==================
let mesRes=null;
function vResultados(){
  const t0=today0();if(!mesRes)mesRes=`${t0.getFullYear()}-${String(t0.getMonth()+1).padStart(2,'0')}`;
  const [y,m]=mesRes.split('-').map(Number);const desde=dStr(new Date(y,m-1,1));const hasta=dStr(new Date(y,m,0));
  const vs=DB.sales.filter(s=>s.date>=desde&&s.date<=hasta);const tot=vs.reduce((a,s)=>a+(+s.total||0),0);
  const rec=recuperados(desde,hasta);const recT=rec.reduce((a,r)=>a+r.total,0);
  const msgs=DB.contacts.filter(x=>x.date>=desde&&x.date<=hasta);
  const clientesCompr=new Set(vs.map(s=>s.clientId)).size;
  // semanas del mes
  const sem=[0,0,0,0,0];vs.forEach(s=>{const d=dParse(s.date).getDate();sem[Math.min(4,Math.floor((d-1)/7))]+=(+s.total||0);});
  const mx=Math.max(1,...sem);
  // meses disponibles
  const meses=new Set([mesRes]);DB.sales.forEach(s=>meses.add(s.date.slice(0,7)));
  const opts=[...meses].sort().reverse().map(k=>{const [yy,mm]=k.split('-').map(Number);return `<option value="${k}" ${k===mesRes?'selected':''}>${MES[mm-1].toUpperCase()} ${yy}</option>`;}).join('');
  // top clientes
  const porCli={};vs.forEach(s=>porCli[s.clientId]=(porCli[s.clientId]||0)+(+s.total||0));
  const top=Object.entries(porCli).sort((a,b)=>b[1]-a[1]).slice(0,5);
  let h=`<div class="fld" style="margin:0 0 10px"><select id="mes">${opts}</select></div>
  <div class="kpis">
    <div class="kpi"><span class="ico">💰</span><small>Ventas del mes</small><b>${sol0(tot)}</b><span class="hint">${vs.length} ventas · ${clientesCompr} clientes</span></div>
    <div class="kpi"><span class="ico">💬</span><small>Mensajes enviados</small><b>${msgs.length}</b><span class="hint">desde la app</span></div>
    <div class="kpi pu" style="grid-column:span 2"><span class="ico">🎉</span><small>Recuperados con un mensaje</small><b>${rec.length} <span style="font-size:16px;color:#fff">· ${sol(recT)}</span></b><span class="hint">Clientes que volvieron a comprar hasta 10 días después de tu mensaje</span></div>
  </div>
  <h2 class="sec">Ventas por semana</h2>
  <div class="card"><div class="bars">${sem.map((v,i)=>`<div class="bc"><span class="v">${v?sol0(v):''}</span><div class="bar" style="height:${Math.max(2,v/mx*100)}%"></div><small>Sem ${i+1}</small></div>`).join('')}</div></div>
  <h2 class="sec">Clientes recuperados <span class="cnt">${rec.length}</span></h2>`;
  if(!rec.length)h+=`<div class="card empty" style="padding:22px"><div class="em">💬</div><b>Aún no hay recuperados este mes</b>Escribe a los clientes en alerta desde Inicio y registra su compra cuando vuelvan.</div>`;
  else h+=`<div class="list">${rec.map(r=>{const c=DB.clients.find(x=>x.id===r.clientId);if(!c)return '';return `<button class="li" data-ver="${c.id}"><div class="av" style="background:${colorOf(c.id)}">${esc(ini(c.name))}</div><div class="tx"><b>${esc(c.name)}</b><small>Volvió el ${fFecha(r.date)}</small></div><div class="rt"><span class="tag t-ok">+ ${sol(r.total)}</span></div></button>`;}).join('')}</div>`;
  h+=`<h2 class="sec">Mejores clientes del mes</h2>`;
  if(!top.length)h+=`<div class="card empty" style="padding:22px">Sin ventas registradas en este mes.</div>`;
  else h+=`<div class="list">${top.map(([cid,v],i)=>{const c=DB.clients.find(x=>x.id===cid);if(!c)return '';return `<button class="li" data-ver="${c.id}"><div class="av" style="background:${colorOf(c.id)}">${i+1}</div><div class="tx"><b>${esc(c.name)}</b></div><div class="rt"><b style="font-weight:800">${sol(v)}</b></div></button>`;}).join('')}</div>`;
  $('#view').innerHTML=h+FOOT;
  $('#mes').onchange=e=>{mesRes=e.target.value;vResultados();};
  bindCommon();
}

function catalogoOrdenado(){ensureProducts();const pop=popularidad();return DB.products.slice().sort((a,b)=>(pop[b.name.toLowerCase()]||0)-(pop[a.name.toLowerCase()]||0)||a.name.localeCompare(b.name));}

const phon=w=>w.replace(/ch/g,'x').replace(/ll/g,'y').replace(/qu/g,'k').replace(/c([aou])/g,'k$1').replace(/c([ei])/g,'s$1').replace(/g([ei])/g,'j$1').replace(/gu([ei])/g,'g$1').replace(/^h|([^c])h/g,'$1').replace(/v/g,'b').replace(/z/g,'s').replace(/w/g,'gu').replace(/(.)\1/g,'$1');
const tol=w=>w.length>=8?2:w.length>=4?1:0;
const variantes=w=>{const v=[w];const m=w.match(/^(.{2,}?)(c?it[oa])$/);if(m){const r=m[1];v.push(r,r+'e',r+'a',r+'o',r.replace(/c$/,'z'));}return v;};
const parecido=(c,w)=>{if(c===w)return true;const mn=Math.min(c.length,w.length),mx=Math.max(c.length,w.length);
  if(mn>=4&&mn/mx>=.6&&(c.startsWith(w)||w.startsWith(c)))return true;const t=Math.min(tol(c),tol(w));if(t>0&&lev(c,w)<=t)return true;const pc=phon(c),pw=phon(w);if(pc===pw&&mn>=3)return true;return t>0&&pc.length>=4&&lev(pc,pw)<=1;};
const FUZZ_STOP='mandame mandarme mandas enviame enviarme separame separarme traeme porfavor porfis favorcito gracias necesito quisiera queria buenas buenos pedido siguiente casera casero caserita caserito vecina vecino'.split(' ');
const UNIT_KEYS=Object.keys(UNITS).filter(k=>k.length>=4);
let CAT_WORDS=[];
function fixTok(w){if(isNum(w)||UNITS[w]||STOP.has(w)||NUMW[w]!==undefined)return w;
  if(CAT_WORDS.some(c=>parecido(c,sing(w))))return w;
  if(w.length>=6){for(const u of UNIT_KEYS)if(u.length>=6&&lev(w,u)<=1)return u;}
  if(w.length>=5){for(const s of FUZZ_STOP)if(s.length>=6&&lev(w,s)<=(s.length>=8?2:1))return s;}
  for(const k in NUMW)if(k.length>=4&&lev(w,k)<=1)return k;return w;}
const esCant=w=>isNum(w)||(NUMW[w]!==undefined)||w==='docena'||w==='docenas';
const esCont=w=>!esCant(w)&&!UNITS[w]&&!STOP.has(w)&&w!=='x'&&w.length>1;
// separa "2 arroz 3 aceite 1 leche" o "arroz 2 aceite 3" en varios productos
function segmentar(t){
  const f=t.find(w=>esCant(w)||esCont(w));if(!f)return [t];
  const segs=[];let cur=[];const tieneCont=a=>a.some(esCont);const tieneCant=a=>a.some(esCant);
  if(esCant(f)){ // cantidad antes del producto
    for(let i=0;i<t.length;i++){const w=t[i],prev=t[i-1],nx=t[i+1],nx2=t[i+2];
      const pegadoACant=(w==='docena'||w==='docenas')&&prev&&esCant(prev);
      if(esCant(w)&&!pegadoACant&&tieneCont(cur)){
        const esTamano=tieneCant(cur)&&nx&&UNITS[nx]&&nx!=='docena'&&(!nx2||esCant(nx2));
        if(!esTamano){segs.push(cur);cur=[];}}
      cur.push(w);}
  }else{ // producto y luego cantidad
    for(let i=0;i<t.length;i++){const w=t[i];cur.push(w);
      if(esCant(w)&&tieneCont(cur)){let j=i+1;if(t[j]&&(UNITS[t[j]]||t[j]==='docena')){cur.push(t[j]);j++;}if(t[j]==='x'&&isNum(t[j+1]||'')){}
        segs.push(cur);cur=[];i=j-1;}
      else if(w==='x'&&isNum(t[i+1]||'')&&tieneCont(cur)){cur.push(t[i+1]);segs.push(cur);cur=[];i++;}}
  }
  if(cur.length){if(!tieneCont(cur)&&segs.length)segs[segs.length-1].push(...cur);else segs.push(cur);}
  return segs;
}
function corregirPalabra(w){const n=deacc(w.toLowerCase());if(n.length<3)return null;let best=null,bd=9;
  for(const d of DICC){const dn=deacc(d.toLowerCase());if(dn===n)return d;const sv=sing(n),sd=sing(dn);if(sv===sd)return d;const pn=phon(sv),pd=phon(sd);if(pn===pd)return d;const t=Math.min(tol(dn),tol(n));if(t>0){const L=Math.min(lev(n,dn),lev(pn,pd)+.5);if(L<=t&&L<bd){bd=L;best=d;}}}
  return best;}
function nombreBonito(words){let cambios=[];const out=words.map(w=>{const c=corregirPalabra(w);if(c){if(deacc(c.toLowerCase())!==w&&sing(deacc(c.toLowerCase()))!==sing(w))cambios.push(w);return c;}return w.charAt(0).toUpperCase()+w.slice(1);});return {txt:out.join(' '),cambios};}
function interpretar(texto){
  const prods=catalogoOrdenado().map(prodInfo);
  if(!DB.alias)DB.alias={};
  CAT_WORDS=[...new Set(prods.flatMap(o=>o.core))];
  const lineas=deacc(texto.toLowerCase()).replace(/\r/g,'').replace(/[!¡?¿"“”*_]/g,' ').split(/\n|,|;|:|\+| y | e |•|·|\.(?!\d)|\s-\s|\//).map(x=>x.trim()).filter(Boolean);
  const partes=[];lineas.forEach(l=>{const t=toks(l).map(fixTok);if(!t.length)return;segmentar(t).forEach(sg=>partes.push(sg));});
  const ok=[],no=[];
  partes.forEach((t,idx)=>{if(!t.length)return;const raw=t.join(' ');
    let qty=null,unit=null,qi=-1;
    for(let i=0;i<t.length;i++){const w=t[i];let n=null;
      if(isNum(w))n=+w;else if(NUMW[w]!==undefined)n=NUMW[w];else if(w==='docena'||w==='docenas'){n=12;}
      if(n!==null){qty=n;qi=i;const nx=t[i+1];
        if(w!=='docena'&&nx&&(nx==='docena'||nx==='docenas')){qty=n*12;qi=i+1;}
        else if(nx&&UNITS[nx]){unit=UNITS[nx];qi=i+1;}
        break;}}
    if(t.includes('media')&&t.includes('docena')){qty=6;unit=null;}
    const rest=t.filter((w,i)=>!(qi>=0&&i<=qi&&i>=qi-1&&(isNum(w)||NUMW[w]!==undefined||UNITS[w]||w==='docena'||w==='docenas')));
    let size=null;for(let i=0;i<rest.length-1;i++){if(isNum(rest[i])&&UNITS[rest[i+1]]){size={n:rest[i],u:UNITS[rest[i+1]]};break;}}
    if(size&&unit===size.u&&!(qi>=0&&t[qi]===rest[rest.indexOf(size.n)+1]))unit=null;
    if(!unit&&!size){const u=rest.find(w=>UNITS[w]&&w!=='docena');if(u)unit=UNITS[u];}
    const content=rest.filter(w=>!STOP.has(w)&&!isNum(w)&&!UNITS[w]&&NUMW[w]===undefined&&w!=='x'&&w.length>1).map(sing);
    if(!content.length)return;
    const esSaludo=t.some(w=>SALUDO.has(w));
    const key=content.slice().sort().join(' ')+(unit?'|'+unit:'');
    // 1) palabras aprendidas
    const ali=DB.alias[key]||DB.alias[content.slice().sort().join(' ')];
    const pA=ali&&DB.products.find(p=>p.id===ali);
    if(pA){ok.push({name:pA.name,price:+pA.price||0,qty:qty||1,aprendido:true});return;}
    // 2) catálogo (tolera errores de tipeo)
    let best=null,bs=0;
    prods.forEach(o=>{if(!o.core.length)return;let hit=0,exact=0;
      content.forEach(w=>{const vs=variantes(w);const m=o.core.find(c=>vs.some(v=>parecido(c,v)));if(m){hit++;if(m===w)exact++;}});
      if(!hit)return;let sc=hit/Math.max(o.core.length,content.length)+exact*.02;
      if(unit&&o.units.includes(unit))sc+=.25;
      if(size&&o.nums.includes(size.n))sc+=.25;
      const cls=u=>['kg','g','arroba'].includes(u)?'peso':['L','ml','galon'].includes(u)?'vol':u==='unidad'||u==='docena'?'und':'env';
      const choque=unit&&o.units.length&&!o.units.includes(unit)&&o.units.some(u=>cls(u)===cls(unit))&&!(unit==='kg'&&o.units.includes('g'))&&!(unit==='L'&&o.units.includes('ml'));
      if(choque)return;
      if(sc>bs){bs=sc;best=o;}});
    if(best&&bs>=.34){
      let q=qty||1;
      if(unit&&best.units.includes(unit)&&best.nums.length&&qty&&best.nums.includes(String(qty)))q=1;
      if(qty&&t.includes('x')&&best.nums.includes(String(qty))&&best.t.includes('x'))q=1;
      ok.push({name:best.p.name,price:+best.p.price||0,qty:q});return;}
    if(esSaludo&&qty===null)return;
    if(qty===null&&idx===0&&content.length<=2&&partes.length>1)return;
    { // ¿con la corrección ortográfica sí está en el catálogo?
      const cw=content.map(w=>{const c=corregirPalabra(w);return c?sing(deacc(c.toLowerCase())):w;});
      const o2=prods.find(o=>o.core.length&&cw.every(w=>o.core.some(c=>parecido(c,w)))&&!(unit&&o.units.length&&!o.units.includes(unit)&&o.units.some(u=>['kg','g','arroba'].includes(u)===['kg','g','arroba'].includes(unit))));
      if(o2){ok.push({name:o2.p.name,price:+o2.p.price||0,qty:qty||1});return;}}
    const nb=nombreBonito(content);const base=nb.txt;
    const nombre=size?`${base} ${size.n} ${size.u}`:(unit&&unit!=='unidad'?`${base} (${unit})`:base);
    no.push({texto:raw,qty:qty||1,nombre,key,corregido:nb.cambios.length>0});
  });
  // juntar repetidos
  const J=[];ok.forEach(o=>{const e=J.find(x=>x.name===o.name);if(e)e.qty+=o.qty;else J.push({...o});});
  return {ok:J,no};
}

function sheetVenta(cid,estado){
  if(!DB.clients.length){toast('Primero agrega un cliente');sheetCliente(null,c=>sheetVenta(c.id));return;}
  ensureProducts();
  const S=estado||{cid:cid||(DB.clients.length===1?DB.clients[0].id:''),cart:[],date:dStr(today0()),filtro:'',gracias:false};

  const total=()=>S.cart.reduce((a,it)=>a+(+it.qty||0)*(+it.price||0),0);

      <div class="search" style="box-shadow:none;background:var(--bg);margin-bottom:8px">${ICON.search}<input id="vFil" placeholder="Buscar producto" value="${esc(S.filtro)}"></div>

    </div>

      <div id="vCart"></div>
    </div>

    <label style="display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;color:var(--ink2);margin:4px 2px 12px"><input type="checkbox" id="vG" ${S.gracias?'checked':''} style="width:18px;height:18px;accent-color:var(--pu)"> Enviar agradecimiento por WhatsApp</label>

    const drawQA=()=>{const c=DB.clients.find(x=>x.id===S.cid);const st=c?stats(c):null;const last=st&&st.last&&(st.last.items||[]).length?st.last:null;
      $('#vQA').innerHTML=`

        <button class="qb ${st&&st.usual.length?'':'off'}" id="qUsual"><span>⭐</span><b>Lo de siempre</b><small>${st&&st.usual.length?esc(st.usual.length+' productos'):'sin historial'}</small></button>
        <button class="qb ${last?'':'off'}" id="qRep"><span>↻</span><b>Repetir última</b><small>${last?sol(last.total):'sin compras'}</small></button>

      $('#qMonto').onclick=()=>sheetMonto(S);
      $('#qUsual').onclick=()=>{if(!st||!st.usual.length){toast(c?'Este cliente aún no tiene historial':'Elige primero el cliente');return;}
        st.usual.forEach(u=>{const qs=st.ss.slice(-6).map(s=>(s.items||[]).find(i=>i.name===u)).filter(Boolean);const q=qs.length?qs.map(i=>i.qty).sort((a,b)=>a-b)[Math.floor(qs.length/2)]:1;

      $('#qRep').onclick=()=>{if(!last){toast(c?'Este cliente aún no tiene compras':'Elige primero el cliente');return;}last.items.forEach(i=>{const p=DB.products.find(x=>x.name.toLowerCase()===i.name.toLowerCase());cartAdd(i.name,p?p.price:i.price,i.qty);});drawCart();toast('↻ Última compra agregada');};};

      const c2=$('#vCat2');if(c2)c2.onclick=()=>sheetCatalogo(()=>sheetVenta(null,S));};
    const drawCart=()=>{$('#vCart').innerHTML=S.cart.length?S.cart.map((it,i)=>`<div class="ci"><div class="nm"><input data-cn="${i}" value="${esc(it.name)}"></div>
        <div class="st"><button data-m="${i}">−</button><input data-cq="${i}" type="number" min="0" step="1" value="${it.qty}" inputmode="decimal"><button data-p="${i}">＋</button></div>
        <input class="pr ${+it.price?'':'falta'}" data-cp="${i}" type="number" min="0" step="0.1" value="${+it.price||''}" inputmode="decimal" placeholder="S/ ?"></div>`).join('')

      document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{const it=S.cart[+b.dataset.m];it.qty=Math.round((it.qty-1)*100)/100;if(it.qty<=0)S.cart.splice(+b.dataset.m,1);drawCart();});
      document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{S.cart[+b.dataset.p].qty=Math.round((S.cart[+b.dataset.p].qty+1)*100)/100;drawCart();});
      document.querySelectorAll('[data-cq]').forEach(i=>i.onchange=()=>{const v=+i.value;if(v<=0)S.cart.splice(+i.dataset.cq,1);else S.cart[+i.dataset.cq].qty=v;drawCart();});
      document.querySelectorAll('[data-cp]').forEach(i=>i.oninput=()=>{S.cart[+i.dataset.cp].price=+i.value||0;i.classList.toggle('falta',!+i.value);upd();});
      document.querySelectorAll('[data-cn]').forEach(i=>i.onchange=()=>{const v=i.value.trim();if(v)S.cart[+i.dataset.cn].name=v;drawGrid();});

    $('#vFil').oninput=e=>{S.filtro=e.target.value;drawGrid();};
    $('#vLibre').onclick=()=>{S.cart.push({name:'',price:0,qty:1});drawCart();const ins=document.querySelectorAll('[data-cn]');ins[ins.length-1].focus();};
    $('#vF').onchange=e=>{S.date=e.target.value||dStr(today0());upd();};
    $('#vG').onchange=e=>{S.gracias=e.target.checked;};
    drawQA();drawCart();

      // productos nuevos → catálogo
      let nuevos=0;its.forEach(it=>{const ex=DB.products.find(p=>p.name.toLowerCase()===it.name.toLowerCase());if(!ex){DB.products.push({id:uid(),name:it.name,price:it.price});nuevos++;}else if(!ex.price&&it.price){ex.price=it.price;}});

      const c=DB.clients.find(x=>x.id===S.cid);closeSheet();
      const recup=recuperados(dStr(new Date(dParse(f).getTime()-10*DAY)),f).some(r=>r.saleId===nid);
      render();toast(recup?`🎉 ¡${corto(c.name)} volvió! Venta guardada`:`Venta guardada ✓ ${sol(tot)}`+(nuevos?` · ${nuevos} producto${nuevos>1?'s':''} nuevo${nuevos>1?'s':''} al catálogo`:''));
      if(S.gracias)openWA(c,'gracias');};
  });
}

      const r=interpretar(tx);
      $('#tRes').innerHTML=`${r.ok.length?`<div class="card" style="padding:12px"><div style="font-size:12px;font-weight:800;color:var(--ok);margin-bottom:6px">✓ ENCONTRÉ ${r.ok.length} PRODUCTO${r.ok.length>1?'S':''}</div>${r.ok.map(o=>`<div style="display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px dashed var(--line)"><span><b>${o.qty}</b> × ${esc(o.name)}${o.aprendido?' <span class="tag t-pu" style="font-size:10px">aprendido</span>':''}</span><b>${sol(o.qty*o.price)}</b></div>`).join('')}</div>`:''}
        ${r.no.length?`<div class="card" style="padding:12px;margin-top:8px"><div style="font-size:12px;font-weight:800;color:var(--pu2);margin-bottom:2px">＋ PRODUCTOS NUEVOS (${r.no.length})</div><div style="font-size:12px;color:var(--mut);margin-bottom:6px">No están en tu catálogo. Se agregan solos; luego pones el precio en el pedido.</div>${r.no.map((n,i)=>`<div style="padding:6px 0;border-bottom:1px dashed var(--line)"><div style="display:flex;align-items:center;gap:8px;font-size:14px"><b style="min-width:26px">${n.qty} ×</b><input data-nname="${i}" value="${esc(n.nombre)}" style="flex:1;border:1.5px solid var(--line);border-radius:10px;padding:7px 9px;font-weight:700;font-size:14px"></div><div style="font-size:11.5px;color:var(--mut);margin-top:3px">Escribió: "${esc(n.texto)}"${n.corregido?' · <span style="color:var(--ok);font-weight:700">✓ ortografía corregida</span>':''}</div><select data-nsel="${i}" style="width:100%;margin-top:6px;border:1.5px solid var(--line);border-radius:10px;padding:7px;font-size:13px"><option value="__new" selected>＋ Agregar como producto nuevo</option><option value="">— No agregar —</option>${catalogoOrdenado().map(p=>`<option value="${p.id}">Es: ${esc(p.name)}</option>`).join('')}</select><div style="font-size:11px;color:var(--mut);margin-top:3px">Si eliges "Es: …", la app aprende esa palabra para la próxima.</div></div>`).join('')}</div>`:''}
        ${!r.ok.length&&!r.no.length?'<div class="empty" style="padding:12px">No encontré productos en ese mensaje.</div>':''}
        ${r.ok.length||r.no.length?'<button class="btn b-pu b-full" id="tAdd" style="margin-top:10px">Agregar al pedido</button>':''}`;
      const a=$('#tAdd');if(a)a.onclick=()=>{const cartAdd=(name,price,qty)=>{const k=name.toLowerCase();const it=S.cart.find(x=>x.name.toLowerCase()===k);if(it)it.qty+=qty;else S.cart.push({name,price:+price||0,qty});};
        let aprendidos=0;r.ok.forEach(o=>cartAdd(o.name,o.price,o.qty));
        document.querySelectorAll('[data-nsel]').forEach(s=>{const n=r.no[+s.dataset.nsel];if(!s.value)return;if(s.value==='__new'){const inp=document.querySelector(`[data-nname="${s.dataset.nsel}"]`);const nm=(inp&&inp.value.trim())||n.nombre;cartAdd(nm,0,n.qty);if(!DB.alias)DB.alias={};const pid=uid();if(!DB.products.some(p=>p.name.toLowerCase()===nm.toLowerCase())){DB.products.push({id:pid,name:nm,price:0});DB.alias[n.key]=pid;aprendidos++;}}else{const p=DB.products.find(x=>x.id===s.value);cartAdd(p.name,p.price,n.qty);if(!DB.alias)DB.alias={};DB.alias[n.key]=p.id;aprendidos++;}});if(aprendidos)save();
        sheetVenta(null,S);toast(aprendidos?`📋 Pedido armado · aprendí ${aprendidos} palabra${aprendidos>1?'s':''} nueva${aprendidos>1?'s':''}`:'📋 Pedido armado');};};
    $('#tGo').onclick=go;
  });
}
function sheetMonto(S){
  let v=S.monto?String(S.monto):'';
  openSheet('Solo monto',`
    <div class="tot" style="margin-top:0;justify-content:center"><b id="mV" style="font-size:40px">S/ 0</b></div>
    <div class="kp">${['1','2','3','4','5','6','7','8','9','.','0','⌫'].map(k=>`<button data-k="${k}">${k}</button>`).join('')}</div>
    <button class="btn b-pu b-full" id="mOk" style="margin-top:12px;padding:14px;font-size:16px">Usar este monto</button>
    <button class="btn b-ln b-full" id="mBack" style="margin-top:8px">← Volver</button>`,()=>{
    const show=()=>{$('#mV').textContent='S/ '+(v||'0');};show();
    document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{const k=b.dataset.k;if(k==='⌫')v=v.slice(0,-1);else if(k==='.'){if(!v.includes('.'))v=(v||'0')+'.';}else{if(v.includes('.')&&v.split('.')[1].length>=2)return;if(v.length<7)v=(v==='0'?'':v)+k;}show();});
    $('#mOk').onclick=()=>{const n=+v||0;if(!n){toast('Escribe el monto');return;}S.monto=n;S.cart=[];sheetVenta(null,S);toast('💵 Monto listo · toca Guardar');};
    $('#mBack').onclick=()=>sheetVenta(null,S);});
}

    const go=()=>{const q=normPhone($('#wN').value);const r=$('#wR');if(q.length<6){r.innerHTML='<div class="empty" style="padding:14px">Escribe al menos 6 dígitos.</div>';return;}
      const c=DB.clients.find(x=>{const p=normPhone(x.phone);return p&&(p===q||p.endsWith(q)||q.endsWith(p));});
      if(!c){r.innerHTML=`<div class="card empty" style="padding:18px"><div class="em">🤔</div><b>No está en tus clientes</b>¿Quieres agregarlo ahora?<div class="row2" style="justify-content:center"><button class="btn b-pu" id="wAdd">＋ Agregar como cliente</button></div></div>`;
        $('#wAdd').onclick=()=>{const ph=$('#wN').value;closeSheet();sheetCliente({name:'',phone:ph,notes:'',freq:''});setTimeout(()=>{const t=document.querySelector('.sheet h3');if(t)t.textContent='Nuevo cliente';},10);};return;}
      const st=stats(c);

        ${st.usual.length?`<div class="card" style="margin-top:10px;font-size:14px">🛒 <b>Lo de siempre:</b> ${esc(st.usual.join(', '))}</div>`:''}
        <button class="btn b-gh b-full" id="wVer" style="margin-top:10px">Ver ficha completa</button>`;
      $('#wVer').onclick=()=>{closeSheet();sheetDetalle(c.id);};};
    $('#wB').onclick=go;$('#wN').onkeydown=e=>{if(e.key==='Enter')go();};setTimeout(()=>$('#wN').focus(),80);
  });
}

function localStorageGet(k){try{return localStorage.getItem('vuelve_'+k);}catch(e){return null;}}
function localStorageSet(k,v){try{localStorage.setItem('vuelve_'+k,v);}catch(e){}}
let deferredPrompt=null;
const esStandalone=()=>window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true;
const esIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent);
const enWeb=()=>location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1';
const puedeInstalar=()=>!esStandalone()&&(!!deferredPrompt||(esIOS()&&enWeb()));
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;$('#btnInst').classList.remove('hide');if(TAB==='inicio')vInicio();if(TAB==='ajustes')pintarInstalar();});
window.addEventListener('appinstalled',()=>{deferredPrompt=null;$('#btnInst').classList.add('hide');toast('✓ Vuelve quedó instalada en tu celular');render();});
async function instalar(){
  if(deferredPrompt){deferredPrompt.prompt();const r=await deferredPrompt.userChoice;deferredPrompt=null;$('#btnInst').classList.add('hide');if(r.outcome==='accepted')toast('Instalando Vuelve… 📲');render();return;}
  openSheet('Instalar Vuelve',instrucciones());
}
function instrucciones(){
  if(esIOS())return `<ol style="padding-left:20px;font-size:14px;line-height:1.7;color:var(--ink2)"><li>Abre esta página en <b>Safari</b>.</li><li>Toca el botón <b>Compartir</b> (cuadrado con flecha ↑).</li><li>Elige <b>“Agregar a inicio”</b> y toca <b>Agregar</b>.</li></ol>`;
  if(!enWeb())return `<p style="font-size:14px;color:var(--ink2);line-height:1.6">Estás abriendo la app como archivo. Para instalarla con ícono propio, ábrela desde el <b>enlace web</b> que te compartieron (empieza con <b>https://</b>) en Google Chrome.</p>`;
  return `<ol style="padding-left:20px;font-size:14px;line-height:1.7;color:var(--ink2)"><li>Abre esta página en <b>Google Chrome</b>.</li><li>Toca los <b>tres puntitos ⋮</b> (arriba a la derecha).</li><li>Elige <b>“Instalar app”</b> o <b>“Agregar a la pantalla principal”</b>.</li></ol>`;
}
function pintarInstalar(){const b=$('#instBox');if(!b)return;
  if(esStandalone()){b.innerHTML='<div style="display:flex;gap:10px;align-items:center"><span style="font-size:26px">✅</span><div><b>Vuelve ya está instalada</b><div style="font-size:12.5px;color:var(--mut)">La estás usando como app.</div></div></div>';return;}
  b.innerHTML=`<div style="font-size:13px;color:var(--ink2);margin-bottom:10px">Ten Vuelve como una app más de tu celular: ícono propio, pantalla completa y funciona sin internet.</div><button class="btn b-pu b-full" id="bInst">📲 ${deferredPrompt?'Instalar ahora':'Cómo instalar'}</button>`;
  $('#bInst').onclick=instalar;}
$('#btnInst').onclick=instalar;
if('serviceWorker' in navigator&&enWeb()&&true){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}
// ================== INICIO ==================
load();render();
})();
